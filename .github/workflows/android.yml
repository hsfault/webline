name: Build WEBLINE APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WEBLINE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::WEBLINE_KEYSTORE_BASE64 secret is missing. Run the 'Create signing key' workflow first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/webline.jks"

      - name: Build release APK
        env:
          WEBLINE_KEYSTORE_PATH: ${{ runner.temp }}/webline.jks
          WEBLINE_KEYSTORE_PASSWORD: ${{ secrets.WEBLINE_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Webline-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk